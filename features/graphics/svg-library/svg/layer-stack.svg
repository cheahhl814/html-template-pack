<!--
  html-template-pack · svg-library · layer-stack
  4-layer architecture/stack diagram with right-side captions. A CSS .layer-stack
  also exists in graphics.css — use this SVG when you want a diagram-style
  rendering with connectors and captions. Tokens: teal deep-blue amber
  navy surface text text-muted font-head font-sans.
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four-layer stack with a caption per layer on the right" style="width:100%;height:auto">
  <title>Layer stack</title>
  <!-- layers (top = user-facing) -->
  <g>
    <rect x="130" y="48" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#f8fafc));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <rect x="130" y="48" width="10" height="74" rx="5" style="fill:var(--teal,#0d9488)"/>
    <text x="320" y="82" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:17px;font-weight:600;fill:var(--text,#0f172a)">Interface</text>
    <text x="320" y="106" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what users touch</text>

    <rect x="130" y="142" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 14%, var(--surface,#f8fafc));stroke:var(--deep-blue,#2c4a7c);stroke-width:2"/>
    <rect x="130" y="142" width="10" height="74" rx="5" style="fill:var(--deep-blue,#2c4a7c)"/>
    <text x="320" y="176" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:17px;font-weight:600;fill:var(--text,#0f172a)">Services</text>
    <text x="320" y="200" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">business logic</text>

    <rect x="130" y="236" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 14%, var(--surface,#f8fafc));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <rect x="130" y="236" width="10" height="74" rx="5" style="fill:var(--amber,#f59e0b)"/>
    <text x="320" y="270" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:17px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
    <text x="320" y="294" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">state + pipeline</text>

    <rect x="130" y="330" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--navy,#1a2744) 26%, var(--surface,#f8fafc));stroke:var(--navy,#1a2744);stroke-width:2"/>
    <rect x="130" y="330" width="10" height="74" rx="5" style="fill:var(--navy,#1a2744)"/>
    <text x="320" y="364" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:17px;font-weight:600;fill:var(--text,#0f172a)">Infrastructure</text>
    <text x="320" y="388" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">compute + network</text>
  </g>
  <!-- right captions -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4" fill="none">
    <line x1="520" y1="85"  x2="640" y2="85"/>
    <line x1="520" y1="179" x2="640" y2="179"/>
    <line x1="520" y1="273" x2="640" y2="273"/>
    <line x1="520" y1="367" x2="640" y2="367"/>
  </g>
  <g style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">
    <text x="648" y="89">owner: team A</text>
    <text x="648" y="183">owner: team B</text>
    <text x="648" y="277">owner: team C</text>
    <text x="648" y="371">owner: platform</text>
  </g>
</svg>
