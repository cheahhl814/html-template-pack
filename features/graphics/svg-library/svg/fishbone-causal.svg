<!--
  html-template-pack · svg-library · fishbone-causal
  Cause-and-effect (Ishikawa) skeleton: spine -> 4 category bones -> outcome box.
  Tokens: coral amber teal deep-blue border-bright text text-muted
  font-head font-sans.
  Edit: 4 category labels + the outcome label (+ short cause ticks as needed).
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Fishbone diagram with four cause categories feeding one outcome box" style="width:100%;height:auto">
  <title>Cause-and-effect fishbone</title>
  <!-- spine -->
  <line x1="60" y1="225" x2="672" y2="225" style="stroke:var(--border-bright,#cbd5e1);stroke-width:3.5" stroke-linecap="round"/>
  <!-- bones -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:2.5" stroke-linecap="round" fill="none">
    <line x1="290" y1="225" x2="160" y2="105"/>
    <line x1="290" y1="225" x2="160" y2="345"/>
    <line x1="520" y1="225" x2="390" y2="105"/>
    <line x1="520" y1="225" x2="390" y2="345"/>
  </g>
  <!-- cause ticks -->
  <g style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-linecap="round" fill="none">
    <line x1="250" y1="189" x2="216" y2="223"/>
    <line x1="222" y1="161" x2="188" y2="195"/>
    <line x1="250" y1="261" x2="216" y2="227"/>
    <line x1="222" y1="289" x2="188" y2="255"/>
    <line x1="480" y1="189" x2="446" y2="223"/>
    <line x1="452" y1="161" x2="418" y2="195"/>
    <line x1="480" y1="261" x2="446" y2="227"/>
    <line x1="452" y1="289" x2="418" y2="255"/>
  </g>
  <!-- category boxes -->
  <g>
    <rect x="95" y="66" width="130" height="34" rx="8" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, var(--surface,#f8fafc));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
    <text x="160" y="88" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:14px;font-weight:600;fill:var(--text,#0f172a)">People</text>
    <rect x="325" y="66" width="130" height="34" rx="8" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 14%, var(--surface,#f8fafc));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
    <text x="390" y="88" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:14px;font-weight:600;fill:var(--text,#0f172a)">Process</text>
    <rect x="95" y="350" width="130" height="34" rx="8" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#f8fafc));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
    <text x="160" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:14px;font-weight:600;fill:var(--text,#0f172a)">Tools</text>
    <rect x="325" y="350" width="130" height="34" rx="8" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 14%, var(--surface,#f8fafc));stroke:var(--deep-blue,#2c4a7c);stroke-width:1.5"/>
    <text x="390" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:14px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
  </g>
  <!-- outcome -->
  <rect x="688" y="188" width="92" height="74" rx="10" style="fill:color-mix(in srgb, var(--navy,#1a2744) 30%, var(--surface,#f8fafc));stroke:var(--navy,#1a2744);stroke-width:2"/>
  <text x="734" y="222" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Outcome</text>
  <text x="734" y="242" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:10px;fill:var(--text-muted,#64748b)">observed</text>
</svg>
