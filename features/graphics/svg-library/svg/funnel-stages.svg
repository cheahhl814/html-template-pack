<!--
  html-template-pack · svg-library · funnel-stages
  4-stage conversion funnel with stage-to-stage percentage callouts.
  Tokens: teal deep-blue amber coral surface text text-muted
  font-head font-sans.
  Edit: stage labels + the percentages. Trapezoid widths are the x-half-values
  in each polygon (260→195→135→85 on an 800-wide canvas). No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four-stage funnel narrowing from top to bottom with conversion percentages" style="width:100%;height:auto">
  <title>Conversion funnel</title>
  <!-- bands (top->bottom) -->
  <g style="stroke:var(--surface,#f8fafc);stroke-width:3" stroke-linejoin="round">
    <polygon points="140,52 660,52 596,128 204,128" style="fill:color-mix(in srgb, var(--teal,#0d9488) 26%, var(--surface,#f8fafc));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <polygon points="204,140 596,140 536,216 264,216" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 24%, var(--surface,#f8fafc));stroke:var(--deep-blue,#2c4a7c);stroke-width:2"/>
    <polygon points="264,228 536,228 478,304 322,304" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 24%, var(--surface,#f8fafc));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <polygon points="322,316 478,316 425,392 375,392" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, var(--surface,#f8fafc));stroke:var(--coral,#ef4444);stroke-width:2"/>
  </g>
  <!-- stage labels -->
  <g text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">
    <text x="400" y="98">Visitors</text>
    <text x="400" y="186">Sign-ups</text>
    <text x="400" y="274">Actives</text>
    <text x="400" y="362">Payers</text>
  </g>
  <!-- stage percentage callouts -->
  <g style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text-muted,#64748b)">
    <text x="700" y="146">62%</text>
    <text x="700" y="234">44%</text>
    <text x="700" y="322">31%</text>
  </g>
  <g style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4" fill="none">
    <line x1="640" y1="134" x2="690" y2="141"/>
    <line x1="560" y1="222" x2="690" y2="229"/>
    <line x1="500" y1="310" x2="690" y2="317"/>
  </g>
  <text x="700" y="408" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:11px;fill:var(--text-muted,#64748b)">stage conversion</text>
</svg>
